server {
    listen 443 ssl;
    server_name tools.iamxmm.xyz;

    # /root 是 700，www-data 读不到 /root/app/tools，deploy.sh 会把 public/ 同步到这里
    root /var/www/tools.iamxmm.xyz;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/iamxmm.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iamxmm.xyz/privkey.pem;

    access_log /var/log/nginx/tools.iamxmm.xyz_access.log;
    error_log /var/log/nginx/tools.iamxmm.xyz_error.log;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}

server {
    listen 80;
    server_name tools.iamxmm.xyz;
    return 301 https://$host$request_uri;
}
