<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>json / tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/home.css?v=3">
<link rel="stylesheet" href="/tool.css?v=3">
</head>
<body>
<main class="page wide">
  <header class="mast">
    <p class="kicker"><a href="/">tools</a> <span class="sep">/</span> json</p>
    <h1 class="mark small">json<span class="slash">/</span></h1>
    <p class="lede">JSON 格式化、压缩、校验、转义与键排序，输入即实时校验。</p>
  </header>

  <section class="work">
    <div class="bar">
      <div class="seg" role="group" aria-label="操作">
        <button type="button" data-op="format" class="on">格式化</button>
        <button type="button" data-op="minify">压缩</button>
        <button type="button" data-op="escape">转义</button>
        <button type="button" data-op="unescape">去转义</button>
      </div>
      <div class="seg" role="group" aria-label="缩进">
        <button type="button" data-indent="2" class="on">2 空格</button>
        <button type="button" data-indent="4">4 空格</button>
        <button type="button" data-indent="tab">Tab</button>
      </div>
      <label class="opt"><input type="checkbox" id="sortKeys">键排序</label>
      <span class="spacer"></span>
      <button type="button" class="btn" id="swap">⇄ 结果作为输入</button>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <h2 id="inTitle">输入</h2><span class="meta" id="inMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" data-clear="#input">清空</button>
        </div>
        <textarea class="io" id="input" spellcheck="false" placeholder="在这里粘贴 JSON"></textarea>
        <div class="status" id="status"></div>
        <div class="status err" id="warn" hidden></div>
      </div>
      <div class="pane">
        <div class="pane-head">
          <h2 id="outTitle">结果</h2><span class="meta" id="outMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" data-copy="#output">复制</button>
        </div>
        <textarea class="io" id="output" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span><a href="/">← 全部工具</a></span>
    <span>全部在浏览器本地处理</span>
  </footer>
</main>
<script src="/common.js?v=1"></script>
<script src="/json/app.js?v=1"></script>
</body>
</html>
