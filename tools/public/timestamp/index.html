<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>timestamp / tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/home.css?v=3">
<link rel="stylesheet" href="/tool.css?v=4">
<link rel="stylesheet" href="/timestamp/style.css?v=1">
</head>
<body>
<main class="page wide">
  <header class="mast">
    <p class="kicker"><a href="/">tools</a> <span class="sep">/</span> timestamp</p>
    <h1 class="mark small">timestamp<span class="slash">/</span></h1>
    <p class="lede">Unix 时间戳（秒 / 毫秒）与日期时间互转，按本地时区解析。</p>
  </header>

  <section class="work">
    <div class="bar now">
      <span class="now-label">现在</span>
      <button type="button" class="now-val" id="nowS" title="点击复制秒">-</button>
      <button type="button" class="now-val" id="nowMs" title="点击复制毫秒">-</button>
      <span class="spacer"></span>
      <span class="meta" id="tz"></span>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <h2>时间戳 → 日期</h2><span class="meta" id="tsMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" id="tsNow">填入现在</button>
          <button type="button" class="tbtn" data-clear="#tsIn">清空</button>
        </div>
        <input type="text" class="field wide" id="tsIn" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="如 1790000000 或 1790000000000">
        <div class="status" id="tsStatus"></div>
        <table class="kv"><tbody id="tsOut"></tbody></table>
      </div>
      <div class="pane">
        <div class="pane-head">
          <h2>日期 → 时间戳</h2><span class="meta" id="dtMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" id="dtNow">填入现在</button>
          <button type="button" class="tbtn" data-clear="#dtIn">清空</button>
        </div>
        <input type="text" class="field wide" id="dtIn" autocomplete="off" spellcheck="false" placeholder="如 2026-09-27 12:00:00、2026/09/27、ISO 8601">
        <div class="status" id="dtStatus"></div>
        <table class="kv"><tbody id="dtOut"></tbody></table>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span><a href="/">← 全部工具</a></span>
    <span>全部在浏览器本地处理</span>
  </footer>
</main>
<script src="/common.js?v=1"></script>
<script src="/timestamp/app.js?v=1"></script>
</body>
</html>
