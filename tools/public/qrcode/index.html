<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>qrcode / tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/home.css?v=3">
<link rel="stylesheet" href="/tool.css?v=4">
<link rel="stylesheet" href="/qrcode/style.css?v=1">
</head>
<body>
<main class="page wide">
  <header class="mast">
    <p class="kicker"><a href="/">tools</a> <span class="sep">/</span> qrcode</p>
    <h1 class="mark small">qrcode<span class="slash">/</span></h1>
    <p class="lede">文本或链接实时生成二维码，可调纠错等级、尺寸、边距和颜色，下载 PNG / SVG。</p>
  </header>

  <section class="work">
    <div class="bar">
      <div class="seg" role="group" aria-label="纠错等级">
        <button type="button" data-ecc="L">L</button>
        <button type="button" data-ecc="M" class="on">M</button>
        <button type="button" data-ecc="Q">Q</button>
        <button type="button" data-ecc="H">H</button>
      </div>
      <label class="opt" for="size">尺寸 px</label>
      <input class="field num" id="size" type="number" min="64" max="2048" step="8" value="320" inputmode="numeric">
      <label class="opt" for="margin">边距（模块）</label>
      <input class="field num" id="margin" type="number" min="0" max="16" value="4" inputmode="numeric">
      <label class="opt">前景<input type="color" class="swatch-in" id="fg" value="#000000"></label>
      <label class="opt">背景<input type="color" class="swatch-in" id="bg" value="#ffffff"></label>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <h2>内容</h2><span class="meta" id="inMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" data-clear="#input">清空</button>
        </div>
        <textarea class="io" id="input" spellcheck="false" placeholder="输入文本或链接"></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="pane">
        <div class="pane-head">
          <h2>二维码</h2><span class="meta" id="outMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" id="dlPng">下载 PNG</button>
          <button type="button" class="tbtn" id="dlSvg">下载 SVG</button>
        </div>
        <div class="qr-box" id="box">
          <canvas id="canvas" width="320" height="320" aria-label="二维码预览"></canvas>
          <p class="qr-empty" id="empty">输入内容后在这里预览</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span><a href="/">← 全部工具</a></span>
    <span>全部在浏览器本地处理 · 编码库 qrcode-generator（MIT）</span>
  </footer>
</main>
<script src="/common.js?v=1"></script>
<script src="/qrcode/vendor/qrcode.js?v=1.4.4"></script>
<script src="/qrcode/app.js?v=1"></script>
</body>
</html>
