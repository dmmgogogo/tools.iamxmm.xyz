<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>diff / tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/home.css?v=4">
<link rel="stylesheet" href="/tool.css?v=5">
<link rel="stylesheet" href="/diff/style.css?v=1">
</head>
<body>
<main class="page wide">
  <header class="mast">
    <p class="kicker"><a href="/">tools</a> <span class="sep">/</span> diff</p>
    <h1 class="mark small">diff<span class="slash">/</span></h1>
    <p class="lede">逐行对比两段文本，统一视图高亮新增与删除。</p>
  </header>

  <section class="work">
    <div class="bar">
      <button type="button" class="btn primary" id="run">对比</button>
      <label class="opt"><input type="checkbox" id="optTrim">忽略首尾空白</label>
      <label class="opt"><input type="checkbox" id="optCase">忽略大小写</label>
      <span class="spacer"></span>
      <button type="button" class="btn" id="swap">⇄ 交换左右</button>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <h2>原文</h2><span class="meta" id="aMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" data-clear="#a">清空</button>
        </div>
        <textarea class="io" id="a" spellcheck="false" placeholder="旧版本文本"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <h2>新文</h2><span class="meta" id="bMeta"></span>
          <span class="spacer"></span>
          <button type="button" class="tbtn" data-clear="#b">清空</button>
        </div>
        <textarea class="io" id="b" spellcheck="false" placeholder="新版本文本"></textarea>
      </div>
    </div>

    <div class="panes single">
      <div class="pane">
        <div class="pane-head">
          <h2>差异</h2>
          <span class="meta"><span class="stat-add" id="statAdd"></span> <span class="stat-del" id="statDel"></span></span>
        </div>
        <div class="diff" id="out"></div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span><a href="/">← 全部工具</a></span>
    <span>全部在浏览器本地处理</span>
  </footer>
</main>
<script src="/common.js?v=2"></script>
<script src="/diff/app.js?v=1"></script>
</body>
</html>
