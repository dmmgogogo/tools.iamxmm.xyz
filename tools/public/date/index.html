<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>date / tools</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/home.css?v=4">
<link rel="stylesheet" href="/tool.css?v=5">
<link rel="stylesheet" href="/date/style.css?v=1">
</head>
<body>
<main class="page wide">
  <header class="mast">
    <p class="kicker"><a href="/">tools</a> <span class="sep">/</span> date</p>
    <h1 class="mark small">date<span class="slash">/</span></h1>
    <p class="lede">日期相差天数与工作日、日期加减、年龄 / 星座 / 生肖。按本地日期计算。</p>
  </header>

  <section class="work">
    <div class="bar">
      <button type="button" class="btn" id="fillToday">全部填入今天</button>
      <span class="spacer"></span>
      <span class="note">工作日只算周一至周五，不含法定节假日与调休</span>
    </div>

    <div class="panes tri">
      <div class="pane">
        <div class="pane-head"><h2>两个日期相差</h2></div>
        <div class="form">
          <label for="dA">开始</label><input type="date" class="field" id="dA">
          <label for="dB">结束</label><input type="date" class="field" id="dB">
          <span></span><label class="opt"><input type="checkbox" id="incl">含首尾两天（+1 天）</label>
        </div>
        <div class="status" id="stA"></div>
        <table class="kv"><tbody id="outA"></tbody></table>
      </div>

      <div class="pane">
        <div class="pane-head"><h2>日期加减</h2></div>
        <div class="form">
          <label for="dBase">日期</label><input type="date" class="field" id="dBase">
          <label for="nAdd">加减</label>
          <span class="inline">
            <input type="number" class="field num" id="nAdd" value="30" step="1">
            <select class="field" id="unit">
              <option value="d">天</option><option value="w">周</option><option value="m">月</option><option value="y">年</option>
            </select>
          </span>
        </div>
        <div class="status" id="stB"></div>
        <table class="kv"><tbody id="outB"></tbody></table>
        <p class="note">负数表示往前。加减月 / 年时，若目标月没有该日，取目标月最后一天：1-31 加 1 月 = 2-28（闰年 2-29）。</p>
      </div>

      <div class="pane">
        <div class="pane-head"><h2>年龄计算</h2></div>
        <div class="form">
          <label for="dBirth">出生</label><input type="date" class="field" id="dBirth" value="2000-01-01">
          <label for="dRef">截至</label><input type="date" class="field" id="dRef">
        </div>
        <div class="status" id="stC"></div>
        <table class="kv"><tbody id="outC"></tbody></table>
        <p class="note">2-29 出生者平年按 2-28 过生日。生肖按公历年份计算，春节前出生应算上一年生肖。</p>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span><a href="/">← 全部工具</a></span>
    <span>全部在浏览器本地处理</span>
  </footer>
</main>
<script src="/common.js?v=2"></script>
<script src="/date/app.js?v=1"></script>
</body>
</html>
